[project]
name = "maxpane"
version = "0.9.3"
description = "Terminal dashboards for onchain games, NFTs and trading — Fake World Assets, Talismans, Ten Thousand Tokens, FrenPet, Cat Town and Base. Keyless and read-only."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["blockchain", "dashboard", "terminal", "tui", "onchain", "gaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "pydantic>=2.0",
    # THE LIST's linked-wallet analysis. Published 2026-08-19; declared here
    # only now, because a `pip install maxpane` that cannot resolve is worse
    # than a view that degrades. The guarded import in
    # data/curator_clusters.py stays -- it is what keeps an older or partial
    # install rendering `analysis unavailable` instead of crashing.
    "sybilkit>=0.1.0",
]

[project.scripts]
maxpane = "maxpane_dashboard.__main__:main"
pepepane = "maxpane_dashboard.seat_cli:main"

[project.urls]
Homepage = "https://github.com/banse/maxpane"
Repository = "https://github.com/banse/maxpane"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["maxpane_dashboard/"]

[tool.hatch.build.targets.wheel]
packages = ["maxpane_dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Tiers (CLAUDE.md "Tests"). `-n` is deliberately not in addopts: some tests
# write ~/.maxpane/<game>_cache.json through an un-mocked manager, so a parallel
# run isolates HOME on the command line instead.
markers = [
    "screen: composites a whole dashboard (everything under tests/screens)",
    "sweep: integer size sweep certifying a layout pin (a boundary set since 2026-09-19)",
    "guard: reads repo source or docs rather than exercising code",
    "host: opt-in tests that run journalctl/docker on the real host; never in CI",
]

[project.optional-dependencies]
# pepepane (2026-09-26): the versions the PEPEPANE layout pins were measured on (spec §12.1;
# fill7 §5) and the top of the VPS wheel closure; deploy/vps/requirements.lock carries the
# hashes. The `dependencies` block above is untouched (contract §A.4).
seat = [
    "textual==8.2.8",
    "rich==15.0.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
]

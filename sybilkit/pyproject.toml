[project]
name = "sybilkit"
version = "0.2.0"
description = "Keyless EVM sybil / fan-out cluster analysis. Pure-Python core, optional keyless fetchers, CLI."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["ethereum", "evm", "sybil", "clustering", "onchain", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# The CORE is stdlib-only, on purpose: `import sybilkit` must work with zero
# third-party packages installed (PRD §3.5).  `httpx` is an OPTIONAL extra for
# `sybilkit.sources`, never a hard dependency, and it is imported lazily inside
# the call that needs it -- so `import sybilkit.sources` and `sybilkit --help`
# both work on the pure install and only a live fetch names the extra.
dependencies = []

[project.optional-dependencies]
# `sources/` is the only part of the distribution that opens a socket, and this
# is the only third-party package in the whole tree.  0.27 is the floor because
# that is where `MockTransport` and the `transport=` keyword the test suite
# injects through settled into their current shape.
sources = ["httpx>=0.27"]

[project.scripts]
# `sybilkit analyze|segments|export-clean-list`.  `main()` returns an int and
# never raises for a user error, so the console script's exit status is the
# CLI's own and not a traceback.
sybilkit = "sybilkit.cli:main"

[project.urls]
Homepage = "https://github.com/banse/maxpane"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# `tests/` is deliberately NOT here.  The committed population archives are
# ~3 MB and they are calibration data, not distribution content; the benchmark
# gate reads whatever labeled subset its caller hands it, so a consumer who
# wants to run it points `run_benchmark` at their own.
#
# The leading slashes anchor these at the distribution root.  Unanchored,
# hatchling reads them as gitignore-style patterns and a bare `README.md`
# quietly drags `tests/fixtures/README.md` into the sdist with it.
include = ["/src/sybilkit/", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/sybilkit"]
# `py.typed` is data, not a module, so it is named explicitly rather than
# trusted to a glob: a wheel that ships the code without it is a wheel whose
# type hints no downstream type checker will look at.
artifacts = ["src/sybilkit/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src/` layout: the tests import the package from the source tree, so a
# checkout needs no install to run them.  `.` puts the distribution root on the
# path, so the shared reader imports as `tests.sybilkit_fixtures` -- the same
# spelling the maxpane suite uses for `tests.curator_fixtures`.
pythonpath = ["src", "."]

[project]
name = "sybilkit"
version = "0.0.1"
description = "Keyless EVM sybil / fan-out cluster analysis. Pure-Python core, optional keyless fetchers, CLI."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["ethereum", "evm", "sybil", "clustering", "onchain", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# The CORE is stdlib-only, on purpose: `import sybilkit` must work with zero
# third-party packages installed (PRD §3.5).  WP2 adds `httpx` as an OPTIONAL
# extra for `sybilkit.sources`, never as a hard dependency.
dependencies = []

[project.optional-dependencies]
# WP2 fills this in: sources/ needs httpx, nothing else does.
sources = []

[project.scripts]
# Implemented by WP2 (`sybilkit analyze|segments|export-clean-list`).  Declared
# here so the entry-point name is frozen with the distribution name.
sybilkit = "sybilkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/sybilkit/"]

[tool.hatch.build.targets.wheel]
packages = ["src/sybilkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src/` layout: the tests import the package from the source tree, so a
# checkout needs no install to run them.  `.` puts the distribution root on the
# path, so the shared reader imports as `tests.sybilkit_fixtures` -- the same
# spelling the maxpane suite uses for `tests.curator_fixtures`.
pythonpath = ["src", "."]

# /etc/ssh/sshd_config.d/10-imd-dash.sshd.conf -- spec §12.1 sshd.
# The daily key lives on this account; it gets a TTY and nothing to tunnel with (safety §4: the global
# AllowTcpForwarding is yes). Validate with `sshd -t`, apply with `systemctl reload ssh`.
Match User imd-dash
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY yes

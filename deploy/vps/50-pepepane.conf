# /etc/systemd/system/user-<uid>.slice.d/50-pepepane.conf -- the TUI footprint fence (spec §12.1).
# install.sh substitutes <uid> with `id -u imd-dash`. No user manager, no tmux, no service: logind puts
# every process of the imd-dash login into this slice, so a forge spike kills the TUI's slice, not the worker's.
[Slice]
MemoryMax=256M
CPUQuota=50%

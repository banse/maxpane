# /etc/systemd/system/imd-worker.service.d/20-hide-dash.conf -- owner decision spec §16 #4.
# Applied with `systemctl daemon-reload` and a DRAINED restart of imd-worker.service (pepepane CONTROL [d]).
# The `-` prefix makes each path optional so the worker still starts where the dash is not installed.
[Service]
InaccessiblePaths=-/run/imd-dash -/home/imd-dash -/var/log/imd-dash
ProtectProc=invisible
